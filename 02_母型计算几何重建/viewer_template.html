<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>母型船 · 三维重建</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1825;color:#dfebf3;font:14px system-ui}header{height:92px;padding:18px 25px;border-bottom:1px solid #2c4054;background:linear-gradient(110deg,#192e43,#0d1825)}h1{font-size:21px;margin:0 0 7px;letter-spacing:1px}small{color:#97aebf}section{display:flex;height:calc(100vh - 92px)}aside{width:285px;flex-shrink:0;padding:18px;overflow:auto;background:#122234}main{position:relative;flex:1;min-width:0;background:radial-gradient(ellipse at 50% 40%,#21374b,#0d1825 75%)}canvas{width:100%;height:100%;display:block;touch-action:none}.group{padding:12px 0;border-bottom:1px solid #294053}button{cursor:pointer;border:1px solid #3b566f;background:#20394f;color:#dceaf4;border-radius:6px;padding:8px 10px;margin:3px 3px 3px 0;font:inherit}button:hover,button.active{background:#385c75}.part{display:block;width:100%;text-align:left;border-left:4px solid var(--color);margin:5px 0}.part small{display:block;font-size:11px;margin-top:3px}label{display:block;margin:11px 0}input[type=range]{width:100%}p{line-height:1.7;font-size:12px;color:#94aabc}#badge{position:absolute;bottom:20px;left:24px;color:#bcd0de;font-size:12px;max-width:70%;line-height:1.8;background:#0d1825c9;padding:10px 14px;border-radius:7px}#error{display:none;position:absolute;inset:30px;white-space:pre-wrap;color:#ffb4a8}.tag{display:inline-block;font-size:11px;color:#a5c5d9;border:1px solid #38556c;padding:3px 7px;border-radius:3px;margin:4px 3px 0 0}@media(max-width:720px){aside{width:190px;padding:10px}h1{font-size:17px}header{padding:16px;height:105px}section{height:calc(100vh - 105px)}}</style>
<header><h1 id="title">母型船 · 三维重建</h1><small id="subtitle">读取完整模型…</small></header>
<section><aside><div id="mainviews" class="group"><button id="appearance">整体外观</button><button id="compartments">彩色分舱</button></div>
<div class="group"><button id="reset">三维 / 全部</button><button id="top">俯视</button><button id="side">侧视</button><button id="end">端视</button><button id="bulkheads">隔板总览</button>
<label><input type="checkbox" id="wire"> 显示三角网格</label><label><input type="checkbox" id="cut"> 隐藏半舷</label>
<label>保留船长 <span id="lengthLabel">100%</span><input type="range" id="length" min="5" max="100" value="100"></label></div>
<div id="partcontrols" class="group"><label><input type="checkbox" id="ballast"> 边压载舱</label><label><input type="checkbox" id="db" checked> 双层底空间</label><button id="all">显示全部主要分舱</button></div>
<div id="stats" class="group"></div><div id="parts"></div><p id="note"></p></aside><main><canvas id="view"></canvas><div id="badge">正在初始化…</div><div id="error"></div></main></section>
<script id="model-data" type="application/json">MESH_PAYLOAD</script>
<script>
'use strict';
try{
const data=JSON.parse(document.getElementById('model-data').textContent),isMesh=data.mode==='mesh',canvas=document.getElementById('view'),gl=canvas.getContext('webgl2',{antialias:true,alpha:true});
if(!gl)throw Error('未能启用WebGL2。请使用新版Edge或Chrome，并启用图形加速。');
const lo=data.meshes[0].bounds[0],hi=data.meshes[0].bounds[1],center=lo.map((v,i)=>(v+hi[i])/2),extent=Math.max(...hi.map((v,i)=>v-lo[i]));
function decode(s,Type){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new Type(b.buffer)}
function buffer(type,array){const b=gl.createBuffer();gl.bindBuffer(type,b);gl.bufferData(type,array,gl.STATIC_DRAW);return b}
const meshes=data.meshes.map(p=>{let v=decode(p.positions,Float32Array),n=decode(p.normals,Float32Array),f=decode(p.faces,Uint32Array),edges=new Uint32Array(f.length*2);for(let i=0,j=0;i<f.length;i+=3){edges[j++]=f[i];edges[j++]=f[i+1];edges[j++]=f[i+1];edges[j++]=f[i+2];edges[j++]=f[i+2];edges[j++]=f[i]}return {...p,v:buffer(gl.ARRAY_BUFFER,v),n:buffer(gl.ARRAY_BUFFER,n),f:buffer(gl.ELEMENT_ARRAY_BUFFER,f),edges:buffer(gl.ELEMENT_ARRAY_BUFFER,edges),count:f.length,edgeCount:edges.length,rgb:[1,3,5].map(i=>parseInt(p.color.slice(i,i+2),16)/255)}});
const vert=`#version 300 es
in vec3 position;in vec3 normal;uniform vec3 center;uniform float extent;uniform float yaw;uniform float pitch;uniform float aspect;uniform float zoom;uniform vec2 pan;out vec3 N;out vec3 W;
vec3 rotate(vec3 p){float a=p.x*cos(yaw)-p.y*sin(yaw),b=p.x*sin(yaw)+p.y*cos(yaw);return vec3(a,b*sin(pitch)-p.z*cos(pitch),b*cos(pitch)+p.z*sin(pitch));}
void main(){vec3 p=rotate((position-center)/extent);gl_Position=vec4(p.x*zoom/aspect+pan.x,-p.y*zoom+pan.y,-p.z*.7,1.);N=rotate(normal);W=position;}`;
const frag=`#version 300 es
precision highp float;in vec3 N;in vec3 W;uniform vec3 base;uniform bool cut;uniform float limitX;uniform bool lines;out vec4 color;
void main(){if(cut&&W.y<0.)discard;if(W.x>limitX)discard;if(lines){color=vec4(.04,.1,.14,1.);return;}vec3 n=normalize(N);if(!gl_FrontFacing)n=-n;float light=.47+.48*abs(dot(n,normalize(vec3(.25,-.45,.86))));float shine=pow(max(0.,dot(n,normalize(vec3(-.2,-.5,.85)))),24.);color=vec4(base*light+vec3(.12)*shine,1.);}`;
function shader(t,s){let p=gl.createShader(t);gl.shaderSource(p,s);gl.compileShader(p);if(!gl.getShaderParameter(p,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(p));return p}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const unames=['center','extent','yaw','pitch','aspect','zoom','pan','base','cut','limitX','lines'],u=Object.fromEntries(unames.map(n=>[n,gl.getUniformLocation(program,n)])),pa=gl.getAttribLocation(program,'position'),na=gl.getAttribLocation(program,'normal');gl.enableVertexAttribArray(pa);gl.enableVertexAttribArray(na);gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);gl.uniform3fv(u.center,center);gl.uniform1f(u.extent,extent);
let yaw=-.48,pitch=.85,zoom=1.95,pan=[0,0],drag=null,selected=null,layout=isMesh?'skin':'compartments',queued=false;
const controls=Object.fromEntries(['wire','cut','length','ballast','db'].map(n=>[n,document.getElementById(n)]));controls.wire.checked=isMesh;controls.cut.checked=!isMesh;
function visible(p){if(selected)return p.id===selected;if(layout==='bulkheads')return ['bulkhead','partition'].includes(p.category);if(isMesh)return true;if(layout==='skin')return p.category==='shell';if(p.category==='ballast'&&!controls.ballast.checked)return false;if(p.category==='double_bottom'&&!controls.db.checked)return false;return true}
function schedule(){if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;draw()})}}
function draw(){const dpr=Math.min(devicePixelRatio,2);canvas.width=Math.max(1,Math.round(canvas.clientWidth*dpr));canvas.height=Math.max(1,Math.round(canvas.clientHeight*dpr));gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform1f(u.yaw,yaw);gl.uniform1f(u.pitch,pitch);gl.uniform1f(u.aspect,canvas.width/canvas.height);gl.uniform1f(u.zoom,zoom);gl.uniform2fv(u.pan,pan);gl.uniform1f(u.limitX,lo[0]+(hi[0]-lo[0])*controls.length.value/100);
for(const p of meshes.filter(visible)){gl.bindBuffer(gl.ARRAY_BUFFER,p.v);gl.vertexAttribPointer(pa,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,p.n);gl.vertexAttribPointer(na,3,gl.FLOAT,false,0,0);gl.uniform3fv(u.base,p.rgb);gl.uniform1i(u.cut,controls.cut.checked&&(isMesh||p.category==='shell'||selected!==null));gl.uniform1i(u.lines,0);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.f);gl.drawElements(gl.TRIANGLES,p.count,gl.UNSIGNED_INT,0);gl.disable(gl.POLYGON_OFFSET_FILL);if(controls.wire.checked){gl.uniform1i(u.lines,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.edges);gl.drawElements(gl.LINES,p.edgeCount,gl.UNSIGNED_INT,0)}}}
function choose(id){selected=id;document.querySelectorAll('.part').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const p=meshes.find(p=>p.id===id);document.getElementById('badge').textContent=p?`${p.name} · X ${p.bounds[0][0].toFixed(3)}–${p.bounds[1][0].toFixed(3)} m${['bulkhead','partition'].includes(p.category)?' · 厚 '+p.thickness_mm+' mm':''}`:(layout==='bulkheads'?'隔板总览 · 7道横隔板 + 10块内舷纵隔板 · 三维/全部按钮恢复全模型':isMesh?'钢板材料域 · 蓝色外壁 / 浅灰内壁 / 金色隔板与顶缘':'主要分舱与舱间隔板 · 默认隐藏边压载舱以露出货舱 · 点击名称单独查看');schedule()}
for(const p of meshes){const b=document.createElement('button');b.className='part';b.dataset.id=p.id;b.style.setProperty('--color',p.color);b.textContent=p.name;const s=document.createElement('small');s.textContent=`${p.bounds[0][0].toFixed(1)}–${p.bounds[1][0].toFixed(1)} m`;b.appendChild(s);b.onclick=()=>choose(p.id);document.getElementById('parts').appendChild(b)}
function view(y,p){yaw=y;pitch=p;zoom=1.95;pan=[0,0];schedule()}
function resetAll(){layout=isMesh?'skin':'compartments';choose(null);view(-.48,.85)}document.getElementById('reset').onclick=resetAll;canvas.ondblclick=resetAll;document.getElementById('bulkheads').onclick=()=>{layout='bulkheads';choose(null)};document.getElementById('top').onclick=()=>view(0,1.55);document.getElementById('side').onclick=()=>view(0,0);document.getElementById('end').onclick=()=>view(Math.PI/2,0);
document.getElementById('appearance').onclick=()=>{layout='skin';controls.cut.checked=false;choose(null)};document.getElementById('compartments').onclick=()=>{layout='compartments';controls.cut.checked=true;choose(null)};document.getElementById('all').onclick=()=>{layout='compartments';choose(null)};
for(const c of Object.values(controls))c.oninput=()=>{document.getElementById('lengthLabel').textContent=controls.length.value+'%';schedule()};canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,button:e.button};canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.button===2){pan[0]+=dx*2/canvas.clientWidth;pan[1]-=dy*2/canvas.clientHeight}else{yaw+=dx*.007;pitch=Math.min(1.55,Math.max(-1.55,pitch+dy*.007))}drag.x=e.clientX;drag.y=e.clientY;schedule()};canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(35,Math.max(.3,zoom*Math.exp(-e.deltaY*.001)));schedule()},{passive:false});onresize=schedule;
document.getElementById('title').textContent=isMesh?'计算网格 · 钢板船壳与舱间隔板':'母型船 · 彩色船体、分舱与隔板';document.getElementById('subtitle').textContent='LBP '+data.dimensions.lbp_m+' m · B '+data.dimensions.beam_m+' m · D '+data.dimensions.depth_m+' m | 拖动旋转 · 滚轮缩放 · 右键平移';
const bulkheadCount=meshes.filter(p=>p.category==='bulkhead').length,partitionCount=meshes.filter(p=>p.category==='partition').length;document.getElementById('stats').innerHTML=`<span class="tag">${isMesh?'钢板材料域':'彩色分舱'}</span><span class="tag">单位 m</span><p>${isMesh?meshes.reduce((s,p)=>s+p.triangles,0).toLocaleString()+' 个三角面 · 船壳 '+data.thickness_mm+' mm':meshes.filter(p=>!['shell','bulkhead','partition'].includes(p.category)).length+' 个主要空间 · 光滑着色'}<br>${bulkheadCount} 道横隔板 · ${data.bulkhead_thickness_mm} mm<br>${partitionCount} 块内舷纵隔板 · ${data.partition_thickness_mm} mm</p>`;
document.getElementById('note').textContent=isMesh?'这是船壳、横隔板及货舱—边压载舱内舷隔板的材料模型，包含上部斜板。排水量和浮心仍读取hydro_outer外包络。合计材料质量见steel_materials.json。':'舱室沿横隔板及内舷隔板各退让半板厚，斜板按法向偏移。分舱仍为主要空间示意；未细分全部油水小舱、管弄与墩座。';
if(isMesh){document.getElementById('mainviews').style.display='none';document.getElementById('partcontrols').style.display='none'}choose(null);
}catch(error){const panel=document.getElementById('error');panel.style.display='block';panel.textContent=error.message;document.getElementById('badge').textContent='加载失败';console.error(error)}
</script></html>
