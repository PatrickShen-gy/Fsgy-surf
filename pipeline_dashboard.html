<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>船舶计算结果</title>
<style>:root{font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:#193943;background:#edf3f5}*{box-sizing:border-box}body{margin:0}main{max-width:1420px;margin:auto;padding:30px 24px 60px}h1{font-size:29px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}p{color:#607c87;margin:6px 0}.eyebrow{letter-spacing:.15em;color:#128676;font-size:12px;font-weight:bold}.panel,.card{border:1px solid #d9e6ea;background:#fff;border-radius:14px;padding:19px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin:20px 0}.card{margin:0}.card b{display:block;font-size:23px;color:#1b5261}.card span{color:#68838f;font-size:12px}.notice{padding:13px 16px;border-radius:9px;background:#fff1d9;color:#7b592a;margin:16px 0}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:15px}select{max-width:100%;padding:8px;border:1px solid #cbdde2;border-radius:7px;background:#fff;color:#264e5c}.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}svg{width:100%;height:auto;display:block}.scroll{overflow:auto;max-height:480px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:8px;text-align:right;white-space:nowrap;border-bottom:1px solid #e3edef}td:first-child,th:first-child{text-align:left}th{position:sticky;top:0;background:#f5fafb;color:#607d87;font-size:12px}a{color:#087b70}ul{padding-left:20px;color:#587580;font-size:13px}li{margin:8px 0}.small{font-size:12px;color:#6c8690}@media(max-width:800px){main{padding:18px 10px}.charts{grid-template-columns:1fr}h1{font-size:23px}}</style>
<main><div class="eyebrow">FSGY SURF / CALCULATION PIPELINE</div><h1 id="title"></h1><p id="intro"></p><div class="cards" id="stats"></div><div class="panel"><div class="controls"><label>工况 / 数据集 <select id="case"></select></label><label>明细表 <select id="table"></select></label></div><div class="notice" id="caseNotes"></div><div class="cards" id="metrics"></div></div><div id="charts" class="charts"></div><section class="panel"><h2 id="tableTitle"></h2><div class="scroll" id="tableContent"></div></section><section class="panel"><h2>口径与来源</h2><ul id="notes"></ul><p id="links"></p></section></main>
<script>
const D=__DATA__,$=id=>document.getElementById(id);document.title=D.title;$('title').textContent=D.title;$('intro').textContent=D.intro;
function fmt(v){if(v===null||v===undefined)return '—';if(typeof v==='boolean')return v?'是':'否';if(typeof v==='number')return Number.isInteger(v)?v.toLocaleString('en-US'):v.toLocaleString('en-US',{maximumFractionDigits:5});if(typeof v==='object')return JSON.stringify(v);return String(v)}
function escape(v){return fmt(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
$('stats').innerHTML=Object.entries(D.stats).map(([k,v])=>`<div class="card"><b>${escape(v)}</b><span>${escape(k)}</span></div>`).join('');
$('case').innerHTML=D.cases.map(c=>`<option value="${c.case_id}">${c.case_id} · ${c.description??''}</option>`).join('');
$('notes').innerHTML=D.notes.map(t=>`<li>${escape(t)}</li>`).join('');$('links').innerHTML=Object.entries(D.links).map(([k,v])=>`<a href="${v}">${escape(k)}</a>`).join(' · ');
function draw(chart,index){const w=620,h=340,m={l:76,r:18,t:25,b:43};let pairs=chart.series.flatMap(s=>s.x.map((x,i)=>[x,s.y[i]])).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(!pairs.length)return '';
let xmin=Math.min(...pairs.map(p=>p[0])),xmax=Math.max(...pairs.map(p=>p[0])),lo=Math.min(0,...pairs.map(p=>p[1])),hi=Math.max(...pairs.map(p=>p[1])),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;if(xmax===xmin)xmax=xmin+1;
const x=v=>m.l+(v-xmin)/(xmax-xmin)*(w-m.l-m.r),y=v=>m.t+(hi-v)/(hi-lo)*(h-m.t-m.b);let svg='';
for(let i=0;i<=4;i++){let v=lo+(hi-lo)*i/4;svg+=`<path d="M${m.l} ${y(v)}H${w-m.r}" stroke="#e2ebee"/><text x="${m.l-7}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#6b8792">${Number(v.toPrecision(4))}</text>`;let a=xmin+(xmax-xmin)*i/4;svg+=`<text x="${x(a)}" y="${h-22}" text-anchor="middle" font-size="10" fill="#6b8792">${Number(a.toPrecision(4))}</text>`}
svg+=`<path d="M${m.l} ${y(0)}H${w-m.r}" stroke="#afc3cb"/>`;const palette=['#078c7e','#c58642','#5c7fa5','#ad716b','#82a68c'];chart.series.forEach((s,i)=>{let p=s.x.map((xx,j)=>[xx,s.y[j]]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])),color=s.color??palette[i%palette.length];if(s.dots){for(const r of p)svg+=`<circle cx="${x(r[0])}" cy="${y(r[1])}" r="4" fill="${color}"/>`}else svg+=`<path d="${p.map((r,j)=>`${j?'L':'M'}${x(r[0]).toFixed(2)} ${y(r[1]).toFixed(2)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.9" ${s.dash?'stroke-dasharray="6 4"':''}/>`});svg+=`<text x="${w/2}" y="${h-3}" text-anchor="middle" font-size="11" fill="#63808b">${escape(chart.x_label??'')}</text><text x="${m.l}" y="15" font-size="11" fill="#63808b">${escape(chart.y_label??'')}</text>`;
return `<section class="panel"><h2>${escape(chart.title)}</h2><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${escape(chart.title)}">${svg}</svg><p class="small">${chart.series.map((s,i)=>`<span style="color:${s.color??palette[i%palette.length]}">━━ ${escape(s.name)}</span>`).join('　')}</p></section>`}
function selected(){return D.cases.find(c=>c.case_id===$('case').value)}
function table(){let c=selected(),rows=c.tables[$('table').value]??[];$('tableTitle').textContent=$('table').value;let keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];$('tableContent').innerHTML=`<table><thead><tr>${keys.map(k=>`<th>${escape(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${escape(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function update(){let c=selected(),old=$('table').value;let keys=Object.keys(c.tables);$('table').innerHTML=keys.map(k=>`<option value="${k}">${k}</option>`).join('');$('table').value=keys.includes(old)?old:keys[0];$('caseNotes').textContent=(c.notes??[]).join(' ');$('metrics').innerHTML=Object.entries(c.metrics??{}).map(([k,v])=>`<div class="card"><b>${escape(v)}</b><span>${escape(k)}</span></div>`).join('');$('charts').innerHTML=(c.charts??[]).map(draw).join('');table()}
$('case').addEventListener('input',update);$('table').addEventListener('input',table);update();
</script></html>
